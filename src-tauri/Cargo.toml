[package]
name = "podloader-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "podloader_shell"
path = "src/lib.rs"

[[bin]]
name = "podloader"
path = "src/main.rs"

[dependencies]
podloader-core = { path = "../crates/podloader-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
