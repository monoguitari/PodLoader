[package]
name = "podloader-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alac-encoder = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "ogg", "vorbis", "pcm", "wav", "alac", "isomp4"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.15"
